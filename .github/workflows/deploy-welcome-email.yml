# Deploys the mailing-list welcome email to Supabase.
#
# Supabase is a separate service from the Vercel site deploy, so merging to main
# does not by itself put new function code or migrations into the project. This
# workflow does that, on every change under supabase/.
#
# Two repository secrets are required (Settings -> Secrets and variables ->
# Actions). Until both exist the job skips with a notice rather than failing:
#
#   SUPABASE_ACCESS_TOKEN   supabase.com/dashboard/account/tokens
#   RESEND_API_KEY          resend.com -> API Keys (sending access only)
#
# Deliberately NOT required: the project's database password. A Supabase
# password cannot be read back after the project is created, and rotating it
# breaks anything already connecting with it. Migrations and the Vault writes
# therefore go through the Management API, which the access token alone
# authorises.
#
# The trigger <-> function shared secret is generated here on each run and
# written to both places that need it, so it never has to be stored, pasted, or
# kept in sync by hand.

name: Deploy welcome email

on:
  push:
    branches: [main]
    paths:
      - 'supabase/**'
      - '.github/workflows/deploy-welcome-email.yml'
  workflow_dispatch:

concurrency:
  group: deploy-welcome-email
  cancel-in-progress: false

permissions:
  contents: read

env:
  PROJECT_REF: dnkdbwxsygtptwbemydc
  FUNCTION_NAME: welcome-email

jobs:
  deploy:
    name: Deploy to Supabase
    runs-on: ubuntu-latest
    steps:
      - name: Check that the deploy secrets are configured
        id: cfg
        env:
          ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          missing=''
          [ -n "$ACCESS_TOKEN" ]   || missing="$missing SUPABASE_ACCESS_TOKEN"
          [ -n "$RESEND_API_KEY" ] || missing="$missing RESEND_API_KEY"

          if [ -n "$missing" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Welcome email not deployed::Skipped. Add these repository secrets to enable it:$missing"
            echo "Skipping: missing repository secrets:$missing"
            echo "Setup steps are in supabase/README.md."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.cfg.outputs.ready == 'true'

      - uses: supabase/setup-cli@v1
        if: steps.cfg.outputs.ready == 'true'
        with:
          version: latest

      - name: Generate the trigger/function shared secret
        id: secret
        if: steps.cfg.outputs.ready == 'true'
        run: |
          secret="$(openssl rand -hex 32)"
          echo "::add-mask::$secret"
          echo "value=$secret" >> "$GITHUB_OUTPUT"
          echo "Generated a fresh 32-byte shared secret for this deploy."

      - name: Set Edge Function secrets
        if: steps.cfg.outputs.ready == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          WEBHOOK_SECRET: ${{ steps.secret.outputs.value }}
        run: |
          supabase secrets set --project-ref "$PROJECT_REF" \
            "RESEND_API_KEY=$RESEND_API_KEY" \
            "WELCOME_EMAIL_WEBHOOK_SECRET=$WEBHOOK_SECRET"

      - name: Deploy the Edge Function
        if: steps.cfg.outputs.ready == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy "$FUNCTION_NAME" --project-ref "$PROJECT_REF"

      - name: Apply database migrations
        if: steps.cfg.outputs.ready == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          # Every migration here is written to be idempotent, so replaying one
          # that the project already has is a no-op.
          for file in $(ls supabase/migrations/*.sql | sort); do
            python3 supabase/scripts/mgmt-query.py \
              --project-ref "$PROJECT_REF" --file "$file"
          done

      - name: Store the endpoint and shared secret in Vault
        if: steps.cfg.outputs.ready == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          WEBHOOK_SECRET: ${{ steps.secret.outputs.value }}
        run: |
          python3 supabase/scripts/mgmt-query.py \
            --project-ref "$PROJECT_REF" \
            --file supabase/vault-secrets.sql \
            --var "fn_url=https://${PROJECT_REF}.supabase.co/functions/v1/${FUNCTION_NAME}" \
            --var "fn_secret=$WEBHOOK_SECRET"

      - name: Smoke test the deployed endpoint
        if: steps.cfg.outputs.ready == 'true'
        run: |
          url="https://${PROJECT_REF}.supabase.co/functions/v1/${FUNCTION_NAME}"
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST "$url" \
            -H 'Content-Type: application/json' \
            -H 'x-webhook-secret: not-the-secret' \
            -d '{"type":"INSERT","table":"mailing_list","record":{"email":"nobody@example.com"}}')
          if [ "$code" = '401' ]; then
            echo "Function is live and rejects a bad shared secret."
          else
            echo "::error::Expected HTTP 401 from $url, got $code"
            exit 1
          fi

      - name: Confirm the trigger is wired up
        if: steps.cfg.outputs.ready == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          python3 supabase/scripts/mgmt-query.py \
            --project-ref "$PROJECT_REF" \
            --sql "select tgname from pg_trigger
                   where tgrelid = 'public.mailing_list'::regclass
                     and tgname = 'on_mailing_list_insert_send_welcome';"
          echo "Signups at vthepeople.org will now receive the welcome email."
