# Deploys the mailing-list welcome email to Supabase.
#
# Supabase is a separate service from the Vercel site deploy, so merging to main
# does not by itself put new function code or migrations into the project. This
# workflow does that, on every change under supabase/.
#
# It stays inert until the four repository secrets below exist, so it will not
# fail the build before anyone has configured it:
#
#   SUPABASE_ACCESS_TOKEN         supabase.com/dashboard/account/tokens
#   SUPABASE_DB_PASSWORD          the project's database password
#   RESEND_API_KEY                resend.com -> API Keys (sending access only)
#   WELCOME_EMAIL_WEBHOOK_SECRET  openssl rand -hex 32
#
# Optional, and worth adding — it removes the last manual step:
#
#   SUPABASE_DB_URL               the project's connection string (Project
#                                 Settings -> Database -> Connection string ->
#                                 URI, password filled in). With it, the Vault
#                                 secrets are written automatically; without
#                                 it, the job prints SQL to run once by hand.
#
# Add them under Settings -> Secrets and variables -> Actions.

name: Deploy welcome email

on:
  push:
    branches: [main]
    paths:
      - 'supabase/**'
      - '.github/workflows/deploy-welcome-email.yml'
  workflow_dispatch:

concurrency:
  group: deploy-welcome-email
  cancel-in-progress: false

permissions:
  contents: read

env:
  PROJECT_REF: dnkdbwxsygtptwbemydc
  FUNCTION_NAME: welcome-email

jobs:
  deploy:
    name: Deploy to Supabase
    runs-on: ubuntu-latest
    steps:
      - name: Check that the deploy secrets are configured
        id: cfg
        env:
          ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          WEBHOOK_SECRET: ${{ secrets.WELCOME_EMAIL_WEBHOOK_SECRET }}
        run: |
          missing=''
          [ -n "$ACCESS_TOKEN" ]   || missing="$missing SUPABASE_ACCESS_TOKEN"
          [ -n "$DB_PASSWORD" ]    || missing="$missing SUPABASE_DB_PASSWORD"
          [ -n "$RESEND_API_KEY" ] || missing="$missing RESEND_API_KEY"
          [ -n "$WEBHOOK_SECRET" ] || missing="$missing WELCOME_EMAIL_WEBHOOK_SECRET"

          if [ -n "$missing" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Welcome email not deployed::Skipped. Add these repository secrets to enable it:$missing"
            echo "Skipping: missing repository secrets:$missing"
            echo "Setup steps are in supabase/README.md."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.cfg.outputs.ready == 'true'

      - uses: supabase/setup-cli@v1
        if: steps.cfg.outputs.ready == 'true'
        with:
          version: latest

      - name: Set Edge Function secrets
        if: steps.cfg.outputs.ready == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase secrets set --project-ref "$PROJECT_REF" \
            RESEND_API_KEY="${{ secrets.RESEND_API_KEY }}" \
            WELCOME_EMAIL_WEBHOOK_SECRET="${{ secrets.WELCOME_EMAIL_WEBHOOK_SECRET }}"

      - name: Deploy the Edge Function
        if: steps.cfg.outputs.ready == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy "$FUNCTION_NAME" --project-ref "$PROJECT_REF"

      - name: Apply database migrations
        if: steps.cfg.outputs.ready == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          supabase link --project-ref "$PROJECT_REF"
          supabase db push

      - name: Store the endpoint and shared secret in Vault
        if: steps.cfg.outputs.ready == 'true'
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          WEBHOOK_SECRET: ${{ secrets.WELCOME_EMAIL_WEBHOOK_SECRET }}
        run: |
          url="https://${PROJECT_REF}.supabase.co/functions/v1/${FUNCTION_NAME}"

          if [ -z "$DB_URL" ]; then
            # GitHub masks registered secrets in logs, so the shared secret
            # cannot be printed here — it has to be substituted by hand.
            echo "::notice title=One manual step remains::Add the optional SUPABASE_DB_URL secret to automate this, or run supabase/vault-secrets.sql once in the SQL Editor."
            echo "Run this once in the Supabase dashboard SQL Editor:"
            echo
            echo "  select vault.create_secret('$url',"
            echo "      'welcome_email_function_url', 'Welcome email Edge Function endpoint');"
            echo
            echo "  select vault.create_secret('<same value as the WELCOME_EMAIL_WEBHOOK_SECRET repo secret>',"
            echo "      'welcome_email_webhook_secret', 'Shared secret for the welcome email webhook');"
            exit 0
          fi

          psql "$DB_URL" -v ON_ERROR_STOP=1 \
            -v fn_url="$url" \
            -v fn_secret="$WEBHOOK_SECRET" \
            -f supabase/vault-secrets.sql --quiet
          echo "Vault secrets stored."

      - name: Smoke test the deployed endpoint
        if: steps.cfg.outputs.ready == 'true'
        run: |
          url="https://${PROJECT_REF}.supabase.co/functions/v1/${FUNCTION_NAME}"
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST "$url" \
            -H 'Content-Type: application/json' \
            -H 'x-webhook-secret: not-the-secret' \
            -d '{"type":"INSERT","table":"mailing_list","record":{"email":"nobody@example.com"}}')
          if [ "$code" = '401' ]; then
            echo "Function is live and rejects a bad shared secret."
          else
            echo "::error::Expected HTTP 401 from $url, got $code"
            exit 1
          fi
